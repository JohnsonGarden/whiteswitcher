[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteswitcher"
version = "1.0.0"
description = "Offline VLESS URI to Mihomo YAML converter for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
whiteswitcher = "whiteswitcher.__main__:main"

[tool.setuptools.packages.find]
include = ["whiteswitcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
